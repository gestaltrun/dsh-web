name: Community plugin checks

on:
  pull_request:
    paths:
      - packages/**
      - shared/**
      - scripts/**
      - package.json
      - pnpm-*.yaml
      - vitest.config.mjs
      - tsconfig*.json
      - .github/workflows/**
  push:
    branches: [dev, main, 'codex/**']
    paths:
      - packages/**
      - shared/**
      - scripts/**
      - package.json
      - pnpm-*.yaml
      - vitest.config.mjs
      - tsconfig*.json
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugins-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plugins:
    if: github.repository == 'gestaltrun/dsh-web'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm sync-shared:check
      - run: pnpm libs:check
      - run: pnpm aggregate:check
      - run: pnpm docs:check
      - run: pnpm i18n:check
      - run: pnpm community:check
      - run: pnpm skin-center:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:scripts
      - run: pnpm runtime-deps:check
      - run: pnpm release:pack --out artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: gestaltrun-community-plugins
          path: artifacts/*
          if-no-files-found: error
