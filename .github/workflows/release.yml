name: Publish Gestaltrun plugins

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated archives to npm
        type: boolean
        default: false
      npm_tag:
        description: npm distribution tag
        type: string
        default: latest

      root_package:
        description: Optional package root whose required family dependencies are published
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: gestaltrun-npm-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'gestaltrun/dsh-web'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: '@gestaltrun'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm sync-shared:check
      - run: pnpm libs:check
      - run: pnpm docs:check
      - run: pnpm i18n:check
      - run: pnpm community:check
      - run: pnpm skin-center:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:scripts
      - run: pnpm runtime-deps:check
      - run: pnpm release:pack --out artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: gestaltrun-community-plugins
          path: artifacts/*
          if-no-files-found: error
      - name: Publish reviewed archives
        if: inputs.publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ inputs.npm_tag }}
          ROOT_PACKAGE: ${{ inputs.root_package }}
        run: |
          if [ -n "$ROOT_PACKAGE" ]; then
            pnpm release:publish --from artifacts --tag "$NPM_TAG" --root "$ROOT_PACKAGE"
          else
            pnpm release:publish --from artifacts --tag "$NPM_TAG"
          fi
